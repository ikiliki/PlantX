<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8EC" />
    <script>
      // Paint the chosen garden before the app loads, so a night-garden visit never flashes sunny.
      ;(function () {
        try {
          var garden = localStorage.getItem('plantx.garden')
          if (garden === 'day' || garden === 'night') document.documentElement.dataset.theme = garden
          var night = garden === 'night' || (!garden && matchMedia('(prefers-color-scheme: dark)').matches)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', night ? '#0F1A15' : '#FFF8EC')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="PlantX is a home for people who grow plants at home: a greenhouse for every plant, plant passports, care reminders, photo ID and a community of growers."
    />
    <title>PlantX · A home for every plant you grow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
