# Moves the status label on the issues a PR into master references ("Refs #n", "Fixes #n").
# Opened → status: in PP (the branch's preview is its PP environment). Merged → status: in prod
# (master deploys to production; the issue is closed after it is approved there).
name: Issue status

on:
  pull_request:
    types: [opened, reopened, closed]
    branches: [master]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BODY: ${{ github.event.pull_request.body }}
      TITLE: ${{ github.event.pull_request.title }}
      MERGED: ${{ github.event.pull_request.merged }}
    steps:
      - run: |
          if [ "$MERGED" = "true" ]; then next="status: in prod"; else next="status: in PP"; fi
          issues=$(printf '%s\n%s\n' "$TITLE" "$BODY" | grep -iE '(refs|fixes|closes|resolves)[^#]*#[0-9]+|\(#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | sort -u)
          for n in $issues; do
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" \
              --remove-label "status: in progress" --remove-label "status: in QA" \
              --remove-label "status: in PP" --remove-label "status: in prod" >/dev/null 2>&1 || true
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label "$next" && echo "#$n → $next"
          done
