<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample plant catalog</title>
  </head>
  <body>
    <h1>Sample nursery catalog</h1>
    <p>Local PlantX fixture. Not a live commercial site.</p>
    <table class="catalog">
      <thead>
        <tr>
          <th>Category</th>
          <th>Variety</th>
          <th>Grade</th>
          <th>Size</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-field="category">Monstera</td>
          <td data-field="variety">Albo</td>
          <td data-field="grade">A</td>
          <td data-field="size">M</td>
          <td data-field="price">180</td>
        </tr>
        <tr>
          <td data-field="category">Pothos</td>
          <td data-field="variety">N'Joy</td>
          <td data-field="grade">B</td>
          <td data-field="size">S</td>
          <td data-field="price">42</td>
        </tr>
        <tr>
          <td data-field="category">Fiddle leaf</td>
          <td data-field="variety">Bambino</td>
          <td data-field="grade">A</td>
          <td data-field="size">L</td>
          <td data-field="price">260</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
